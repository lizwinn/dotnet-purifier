# SPDX-License-Identifier: MIT
#
# `nix flake check` on both machines the purifier targets, and a relock of
# every fixture that must reproduce the committed lockfile byte for byte.
# The relock runs on both machines too, since one lock serves both.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L --max-jobs 2

  relock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        fixture: [multi, sources, workloads]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Relock ${{ matrix.fixture }}
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: nix run "$GITHUB_WORKSPACE#default" -- lock --force
      - name: The lockfile is unchanged
        run: git diff --exit-code -- tests/fixtures/${{ matrix.fixture }}/dotnet-purifier.lock.json
